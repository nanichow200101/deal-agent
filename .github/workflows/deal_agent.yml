name: Deal Agent

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (UTC)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to save seen_deals.json and deals_log.csv

concurrency:
  group: deal-agent
  cancel-in-progress: false

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python deal_agent.py --once

      - name: Save state (so old deals aren't alerted again)
        run: |
          git config user.name "deal-agent-bot"
          git config user.email "deal-agent-bot@users.noreply.github.com"
          git add seen_deals.json deals_log.csv 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Update deals" && git push)
